<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="은하사주(Eunha Saju) 공개 문서" />
  <title>은하사주 — 공개 문서</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5a6573;
      --line: #d7dce3;
      --bg: #f7f5f1;
      --surface: #ffffff;
      --accent: #2f4a6e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #dfe8f4 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #ebe4d8 0%, transparent 50%),
        var(--bg);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    main {
      width: min(440px, 100%);
      padding: 2rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .brand {
      margin: 0 0 0.5rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 0.9rem;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      line-height: 1.3;
    }

    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    a.policy {
      display: inline-block;
      padding: 0.7rem 1.1rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    a.policy:hover,
    a.policy:focus {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">은하사주 · Eunha Saju</p>
    <h1>공개 문서</h1>
    <p>앱스토어·플레이스토어 심사용 공개 페이지입니다.</p>
    <a class="policy" href="./privacy-policy.html">개인정보 처리방침 보기</a>
  </main>
</body>
</html>
